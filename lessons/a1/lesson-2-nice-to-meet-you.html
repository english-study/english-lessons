<title>Nice to Meet You</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: one reading column per screen, big type for screen sharing, numbered step dots on top, Back/Next at the bottom.
   Colour: cool paper and ink, blue for actions, yellow = highlighted sound or letter, mint = new words, blue underline = my/your/his/her. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#17202e; --muted:#566175; --line:#d9dfe9;
  --accent:#2a47d6; --accent-ink:#ffffff; --accent-soft:#e4e9fb;
  --hl:#ffe45c; --hl-ink:#17202e; --vocab:#b4ead9; --vocab-ink:#0d3a2e; --now:#dbe4ff;
  --ok:#1b6e45; --ok-soft:#dcf2e6; --bad:#a5281f; --bad-soft:#fde5e1;
  --font-ui:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-text:"Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --surface:#172030; --ink:#e9eef7; --muted:#9aa7bd; --line:#2a3550;
    --accent:#8ea4ff; --accent-ink:#0c1226; --accent-soft:#222e52;
    --hl:#5d4c00; --hl-ink:#ffe98a; --vocab:#1c5a4c; --vocab-ink:#c3f6e7; --now:#23325c;
    --ok:#7fdcab; --ok-soft:#173a2b; --bad:#ff9d93; --bad-soft:#3d1f1c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#172030; --ink:#e9eef7; --muted:#9aa7bd; --line:#2a3550;
  --accent:#8ea4ff; --accent-ink:#0c1226; --accent-soft:#222e52;
  --hl:#5d4c00; --hl-ink:#ffe98a; --vocab:#1c5a4c; --vocab-ink:#c3f6e7; --now:#23325c;
  --ok:#7fdcab; --ok-soft:#173a2b; --bad:#ff9d93; --bad-soft:#3d1f1c; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:18px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.warn{margin:8px 0;padding:10px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:.95rem}

.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.steps button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;padding:0}
.steps li.os button{border-style:dashed}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.eyebrow{margin:14px 0 6px;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{margin:0;font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.12;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h2{margin:30px 0 8px;font-size:1.25rem;font-weight:700}
h3{margin:0;font-size:1.2rem}
.lead{margin:10px 0 0;color:var(--muted);max-width:62ch}
.hint{margin:14px 0 8px;color:var(--muted);font-size:.95rem}
.small{font-size:.88rem;color:var(--muted)}
.body{margin-top:22px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:.92rem}
.mini[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini svg{width:20px;height:20px;flex:none}
.i-stop{display:none}
[aria-pressed="true"]>.i-stop{display:block}
[aria-pressed="true"]>.i-spk{display:none}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.85rem;background:var(--accent-soft);color:var(--accent);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.big-q{font-family:var(--font-text);font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.3;margin:0 0 14px;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.deckbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;color:var(--muted);font-size:.9rem}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.now{background:var(--now)}

/* small talk */
.cloud{display:flex;flex-wrap:wrap;gap:14px 16px;justify-content:center;padding:14px 4px 6px}
.wchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 22px;font-size:1.4rem;font-weight:500}
.wchip.now{background:var(--vocab);color:var(--vocab-ink);border-color:var(--vocab)}
.frame{font-family:var(--font-text);font-size:clamp(1.4rem,3vw,1.9rem);margin:20px 0 0;text-align:center}
.blank{display:inline-block;border-bottom:3px solid var(--ink);min-width:3.2em;height:1.1em;vertical-align:baseline;margin:0 4px}

/* tiles */
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-width:54px;height:72px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;line-height:1.1}
.tile b{font-size:1.9rem}
.tile small{font-size:.72rem;color:var(--muted);min-height:1em}
.tile.now{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.tile.now small{color:var(--hl-ink)}
.tiles.big .tile{min-width:62px;height:86px}
.tiles.big .tile b{font-size:2.3rem}
.groups{display:grid;gap:12px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.group .snd{min-width:4.2em;font-weight:700;color:var(--accent);font-size:1.1rem}
.spellbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:14px}
input.txt{border:0;border-bottom:2px solid var(--accent);background:var(--bg);border-radius:6px 6px 0 0;padding:6px 12px;font-size:1.4rem;min-width:0;width:min(100%,14em)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.legend span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 14px;font-size:.95rem}

/* numbers */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ntile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ntile b{font-size:2rem;line-height:1.1}
.ntile span.nw{font-size:1rem;color:var(--muted);visibility:hidden;min-height:1.5em}
.ntile.shown span.nw{visibility:visible}
.first{font-family:var(--font-text);font-size:clamp(1.4rem,3vw,1.9rem)}
.ntile.now{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.ntile.now .nw{color:var(--hl-ink)}
.sy{display:inline}
.stress .sy.st{color:var(--accent);font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.stress .w .sy+.sy::before{content:"·";color:var(--muted);padding:0 1px;font-weight:400}
.ntile.now .sy.st{color:var(--hl-ink)}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pair{display:flex;gap:8px;align-items:stretch}
.pair .ntile{flex:1;min-width:0}
.vs{align-self:center;color:var(--muted);font-size:.85rem}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 14px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:26px 10px;font-size:clamp(2.4rem,7vw,4rem);font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ctx{font-size:.85rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.sentence{font-family:var(--font-text);font-size:clamp(1.3rem,3vw,1.8rem);margin:10px 0 0}
input.gap,input.age{font-family:var(--font-text);background:var(--bg);border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;padding:0 8px;margin:0 4px;text-align:center;min-width:3em;max-width:100%}
input.age{width:4.5em;font-size:1.8rem}
input.gap.ok{border-bottom-color:var(--ok);background:var(--ok-soft)}
input.gap.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}

/* question list */
.qlist{display:grid;gap:12px;padding:0;margin:0;list-style:none}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.q .en{flex:1 1 280px;font-family:var(--font-text);font-size:clamp(1.25rem,2.6vw,1.6rem);min-width:0}
.q .uk{flex:1 1 100%;color:var(--muted);margin:-4px 0 0}

/* people */
.profile{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:24px;align-items:start}
.photo{aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--accent-soft);border:1px solid var(--line)}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.plines{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.plines li{font-family:var(--font-text);font-size:clamp(1.25rem,2.6vw,1.65rem)}
.s{border-radius:6px;padding:2px 3px;cursor:pointer}
u.pa{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--accent);color:var(--accent);font-weight:700}
table.t{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.t th,table.t td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t th{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--bg)}
table.t td.k{font-weight:700;font-size:1.15rem}
.scroll{overflow-x:auto}
.rev{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:4px 18px;font-weight:700;font-size:1.1rem}
.val{font-family:var(--font-text);font-size:1.4rem}
.dot{display:inline-block;width:.9em;height:.9em;border-radius:50%;margin-right:8px;vertical-align:-.1em;border:1px solid var(--line)}
.cols{display:flex;flex-wrap:wrap;gap:8px}

/* gaps */
.gl-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.gl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.gl-main{display:flex;gap:14px;align-items:baseline}
.num{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--muted);transform:translateY(-2px)}
.gl-text{margin:0;font-family:var(--font-text);font-size:clamp(1.2rem,2.5vw,1.5rem);line-height:2}
.gl-text .h{font-family:var(--font-ui);font-size:.85rem;color:var(--muted);margin-left:6px;white-space:nowrap}
.gl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 0 42px}
.res{font-size:.9rem;font-weight:500}

/* speaking */
.frames{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.fr{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;cursor:pointer;font-family:var(--font-text);font-size:clamp(1.3rem,2.8vw,1.8rem)}
.fr .bx{flex:none;width:1.1em;height:1.1em;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:.8em;color:transparent}
.fr.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.fr .h{font-family:var(--font-ui);font-size:.85rem;color:var(--muted)}
.cy{display:grid;gap:8px;padding:0;margin:8px 0 0;list-style:none}
.cy li{display:flex;align-items:center;gap:12px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.cy .bx{width:1.1em;height:1.1em;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:.8em;color:transparent;flex:none}
.cy li.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.kw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kcard{perspective:900px;cursor:pointer;border:0;background:none;padding:0}
.kin{display:grid;transition:transform .45s;transform-style:preserve-3d}
.kin.on{transform:rotateY(180deg)}
.kf{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:110px;padding:14px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:var(--vocab);color:var(--vocab-ink);font-size:1.5rem;font-weight:700}
.kf.back{transform:rotateY(180deg);background:var(--surface);color:var(--ink);border:1px solid var(--line);font-family:var(--font-text);font-weight:400;font-size:1.2rem}

/* teacher */
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:34px}
.tnote{margin-top:22px;padding:12px 18px;border:2px dashed #c79a00;border-radius:14px;background:var(--hl);color:var(--hl-ink);font-size:.98rem}
.tnote b{letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}
.tnote ul{margin:6px 0 0;padding-left:20px}

@media (max-width:640px){
  body{font-size:17px}
  .profile{grid-template-columns:1fr}
  .photo{max-width:240px}
  .card{padding:16px}
  .gl-meta{margin-left:0}
}
@media (prefers-reduced-motion: reduce){ .kin{transition:none} }
</style>

<div class="wrap" id="app">
  <ol class="steps" id="steps" aria-label="Lesson screens"></ol>
  <p class="warn" id="novoice" role="alert" hidden>This browser cannot speak. Open the page in Chrome.</p>
  <main id="main"></main>
  <div id="tnotes"></div>
  <nav class="nav" aria-label="Previous and next screen">
    <button type="button" class="btn" id="prev">← Back</button>
    <button type="button" class="mini" id="tt" aria-pressed="false">Teacher notes (T)</button>
    <button type="button" class="btn primary" id="next">Next →</button>
  </nav>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const apo=s=>s.replace(/'/g,'’');
const strip=s=>s.replace(/\[\[|\]\]/g,'');
const pa=s=>apo(esc(s)).replace(/\[\[(.+?)\]\]/g,'<u class="pa">$1</u>');
const ISPK='<svg class="i-spk" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ISTOP='<svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
const listenBtn=(text,label,extra)=>`<button type="button" class="mini" data-audio data-say="${esc(text)}" aria-pressed="false" data-label="${label||'Listen'}" ${extra||''}>${ISPK}${ISTOP}<span class="lbl">${label||'Listen'}</span></button>`;

/* ---------------- audio ---------------- */
const synth=window.speechSynthesis; let voice=null, run=0;
function pickVoice(){
  if(!synth) return;
  const vs=(synth.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
  const sc=v=>{let s=0,n=v.name||'';
    if(/natural|neural|premium|enhanced/i.test(n))s+=6; if(/online/i.test(n))s+=3; if(/google/i.test(n))s+=3; if(/multilingual/i.test(n))s-=12;
    if(/aria|jenny|michelle|sonia|libby|samantha|karen|serena|zira|hazel/i.test(n))s+=3;
    if(/compact|espeak|robot|whisper|zarvox|bad news|bells|boing|cellos|trinoids|organ|albert|bubbles|deranged|good news|hysterical|jester|junior|kathy|princess|ralph|superstar/i.test(n))s-=20;
    if(/en[-_]GB/i.test(v.lang))s+=2; if(/en[-_]US/i.test(v.lang))s+=1; return s;};
  voice=vs.sort((a,b)=>sc(b)-sc(a))[0]||null;
}
function setBtn(b,on){ if(!b) return; b.setAttribute('aria-pressed',on?'true':'false'); const l=b.querySelector('.lbl'); if(l) l.textContent=on?'Stop':(b.dataset.label||'Listen'); }
function clearNow(){ $$('.now').forEach(e=>e.classList.remove('now')); $$('[data-audio][aria-pressed="true"]').forEach(b=>setBtn(b,false)); }
function stopAll(){ run++; if(synth) synth.cancel(); clearNow(); }
function sayQueue(items,btn,opt){
  if(!synth) return; if(!voice) pickVoice(); opt=opt||{}; stopAll(); const my=run; setBtn(btn,true); let i=0;
  const next=()=>{
    if(my!==run) return;
    if(i>=items.length){ clearNow(); return; }
    const it=items[i++];
    $$('.now').forEach(e=>e.classList.remove('now')); (it.els||[]).forEach(e=>e&&e.classList.add('now'));
    const u=new SpeechSynthesisUtterance(it.text);
    if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang='en-GB';
    u.rate=it.rate||opt.rate||0.88;
    u.onend=()=>setTimeout(next,opt.gap||280);
    u.onerror=e=>{ if(my===run&&e.error!=='canceled'&&e.error!=='interrupted') clearNow(); };
    window.__u=u; try{synth.resume();}catch(e){} synth.speak(u);
  };
  setTimeout(next,60);
}
if(!synth){ $('#novoice').hidden=false; }
else{ pickVoice(); if(synth.addEventListener) synth.addEventListener('voiceschanged',pickVoice); setTimeout(pickVoice,1500); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]'); if(!b||!b.dataset.say) return;
  const isBtn=b.hasAttribute('data-audio');
  if(b.getAttribute('aria-pressed')==='true'){ stopAll(); return; }
  sayQueue([{text:b.dataset.say,els:isBtn?[]:[b]}],isBtn?b:null);
});
window.addEventListener('pagehide',stopAll);

/* ---------------- helpers ---------------- */
function makeDeck(host,n,draw,word){
  let i=0;
  host.innerHTML=`<div class="deckbar"><span class="cnt"></span><div class="dots">${Array.from({length:n},()=>'<i></i>').join('')}</div></div><div class="stage"></div><div class="controls"><button type="button" class="btn prev">← Previous</button><button type="button" class="btn primary next">Next →</button></div>`;
  const box=$('.stage',host);
  const show=()=>{ stopAll(); $('.cnt',host).textContent=`${word||'Item'} ${i+1} of ${n}`; $$('.dots i',host).forEach((d,k)=>d.classList.toggle('on',k===i)); box.innerHTML=''; draw(i,box); };
  $('.prev',host).onclick=()=>{ i=(i-1+n)%n; show(); };
  $('.next',host).onclick=()=>{ i=(i+1)%n; show(); };
  show();
}
const LN={a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'queue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zed'};
const DG=['zero','one','two','three','four','five','six','seven','eight','nine'];
const SYM={'.':'dot','@':'at','_':'underscore','-':'dash'};
function charInfo(c){
  const l=c.toLowerCase();
  if(LN[l]) return {big:c.toUpperCase(),small:l,say:LN[l]};
  if(/\d/.test(c)) return {big:c,small:DG[+c],say:DG[+c]};
  if(SYM[c]) return {big:c,small:SYM[c],say:SYM[c]};
  return {big:c,small:'',say:c};
}
function spellBuild(segs){
  const tiles=[], items=[];
  segs.forEach(sg=>{
    const isWord=typeof sg!=='string', t=isWord?sg[0]:sg, base=tiles.length, cs=[...t];
    cs.forEach(c=>tiles.push(c));
    if(isWord){ items.push({text:t,idx:cs.map((_,k)=>base+k)}); return; }
    for(let k=0;k<cs.length;k++){
      const c=cs[k], dbl=cs[k+1]&&/[a-z]/i.test(c)&&cs[k+1].toLowerCase()===c.toLowerCase();
      if(dbl){ items.push({text:'double '+charInfo(c).say,idx:[base+k,base+k+1]}); k++; }
      else items.push({text:charInfo(c).say,idx:[base+k]});
    }
  });
  return {tiles,items};
}
function mountSpell(host,segs,btn,big){
  const sp=spellBuild(segs);
  host.className='tiles'+(big?' big':'');
  host.innerHTML=sp.tiles.map(c=>{const ci=charInfo(c);return `<button type="button" class="tile" data-say="${esc(ci.say)}"><b>${esc(ci.big)}</b></button>`;}).join('');
  const els=$$('.tile',host);
  btn.onclick=()=>{
    if(btn.getAttribute('aria-pressed')==='true'){ stopAll(); return; }
    sayQueue(sp.items.map(it=>({text:it.text,els:it.idx.map(k=>els[k]),rate:.8})),btn,{gap:420});
  };
}

/* ---------------- avatars ---------------- */
function avatar(a,name){
  const back=a.style==='long'?`<path d="M30 70 Q30 20 60 20 Q90 20 90 70 L94 125 Q60 135 26 125 Z" fill="${a.hair}"/>`:'';
  const cap=a.style==='long'?`<path d="M34 64 Q36 26 60 26 Q84 26 86 64 Q70 44 34 64Z" fill="${a.hair}"/>`:`<path d="M35 60 Q35 27 60 27 Q85 27 85 60 Q60 46 35 60Z" fill="${a.hair}"/>`;
  return `<svg viewBox="0 0 120 160" role="img" aria-label="Picture of ${name}"><rect width="120" height="160" fill="var(--accent-soft)"/>${back}<path d="M12 160 Q14 118 60 112 Q106 118 108 160Z" fill="${a.shirt}"/><rect x="52" y="96" width="16" height="22" rx="6" fill="${a.skin}"/><ellipse cx="60" cy="70" rx="26" ry="30" fill="${a.skin}"/>${cap}<ellipse cx="50" cy="70" rx="5.5" ry="4" fill="#fff"/><ellipse cx="70" cy="70" rx="5.5" ry="4" fill="#fff"/><circle cx="50" cy="70" r="3" fill="${a.eye}"/><circle cx="70" cy="70" r="3" fill="${a.eye}"/><path d="M52 86 Q60 92 68 86" stroke="#8a4b3a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
}
const silhouette=()=>`<svg viewBox="0 0 120 160" role="img" aria-label="Unknown person"><rect width="120" height="160" fill="var(--accent-soft)"/><path d="M12 160 Q14 118 60 112 Q106 118 108 160Z" fill="var(--line)"/><ellipse cx="60" cy="70" rx="26" ry="30" fill="var(--line)"/><text x="60" y="82" text-anchor="middle" font-size="34" font-weight="700" fill="var(--muted)" font-family="sans-serif">?</text></svg>`;
function photo(key){ const p=PEOPLE[key]; if(PHOTOS[key]) return `<img src="${PHOTOS[key]}" alt="Photo of ${p.name}">`; return p.av?avatar(p.av,p.name):silhouette(); }

/* ---------------- screens ---------------- */
function s1(root){
  makeDeck($('#d',root),TALK.length,(i,box)=>{
    const t=TALK[i];
    box.innerHTML=`<div class="card"><div class="row"><p class="big-q" style="margin:0">${t.q}</p>${listenBtn(t.q)}</div></div>
      <p class="hint">Helper words (tap one to hear it)</p>
      <div class="cloud">${t.words.map((w,k)=>`<button type="button" class="wchip" data-say="${esc(w)}" style="transform:rotate(${ROT[k%12]}deg) translateY(${OFF[k%12]}px);font-size:${(1.4*SCL[k%12]).toFixed(2)}rem">${esc(w)}</button>`).join('')}</div>
      <p class="frame">${t.frame}</p>`;
  },'Question');
}
function s2(root){
  $('#tr',root).onclick=e=>{ $('#trOut',root).hidden=false; e.currentTarget.hidden=true; };
  const go=()=>{ const w=($('#wd',root).value||'').trim().replace(/[^a-z0-9 ]/gi,'').slice(0,18); mountSpell($('#sp',root),w?[w]:['tired'],$('#spBtn',root),true); };
  $('#wd',root).addEventListener('input',()=>{stopAll();go();}); go();
}
function s3(root){
  let mode='sound';
  const all=Object.keys(LN);
  const tile=l=>`<button type="button" class="tile" data-l="${l}" data-say="${esc(LN[l.toLowerCase()])}"><b>${l}</b><small>${l.toLowerCase()}</small></button>`;
  const draw=()=>{
    $('#grid',root).innerHTML=mode==='sound'
      ? `<div class="groups">${GROUPS.map(g=>`<div class="group"><span class="snd">${g[0]}</span><div class="tiles">${[...g[1]].map(tile).join('')}</div></div>`).join('')}</div>`
      : `<div class="tiles">${all.map(l=>tile(l.toUpperCase())).join('')}</div>`;
    $('#mode',root).textContent=mode==='sound'?'Show A to Z':'Group by sound';
  };
  $('#mode',root).onclick=()=>{ stopAll(); mode=mode==='sound'?'abc':'sound'; draw(); };
  $('#all',root).onclick=e=>{
    const b=e.currentTarget; if(b.getAttribute('aria-pressed')==='true'){stopAll();return;}
    sayQueue(all.map(l=>({text:LN[l],els:$$(`.tile[data-l="${l.toUpperCase()}"]`,root)})),b,{gap:380,rate:.8});
  };
  draw();
}
function s4(root){
  makeDeck($('#d',root),SPELLWORDS.length,(i,box)=>{
    const w=SPELLWORDS[i];
    box.innerHTML=`<div class="card"><p class="ctx">${w.label}</p><div id="sp"></div>
      <div class="controls" style="justify-content:flex-start"><button type="button" class="mini" id="spBtn" aria-pressed="false" data-label="Spell it">${ISPK}${ISTOP}<span class="lbl">Spell it</span></button></div>
      ${w.email?'<div class="legend"><span>@ = at</span><span>. = dot</span></div>':''}</div>`;
    mountSpell($('#sp',box),w.segs,$('#spBtn',box),true);
  },'Word');
}
function s5(root){
  $('#grid',root).innerHTML=Array.from({length:21},(_,n)=>ntile(n)).join('');
  $('#tens',root).innerHTML=[20,30,40,50,60,70,80,90,100].map(ntile).join('');
  $('#pairs',root).innerHTML=PAIRS.map(p=>`<div class="pair">${ntile(p[0])}<span class="vs">or</span>${ntile(p[1])}</div>`).join('');
  $$('.ntile',root).forEach(t=>t.addEventListener('click',()=>t.classList.add('shown')));
  $('#hidew',root).onclick=()=>$$('.ntile',root).forEach(t=>t.classList.remove('shown'));
  $('#st',root).onclick=e=>{ const on=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',on); $('#nums',root).classList.toggle('stress',on); e.currentTarget.textContent=on?'Hide stress':'Show stress'; };
}
function s6(root){
  makeDeck($('#d',root),CHECK.length,(i,box)=>{
    const c=CHECK[i];
    box.innerHTML=`<div class="card"><p class="ctx">${c.ctx}</p><div class="row">${listenBtn(c.s,'Play')}<span class="small">He listens and says the number.</span></div></div>
      <div class="optgrid">${c.opts.map(o=>`<button type="button" class="opt" data-o="${o}">${o}</button>`).join('')}</div>
      <p class="sentence" id="rv" hidden>${esc(c.s)}</p>`;
    $$('.opt',box).forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.o===c.ok; b.classList.add(ok?'ok':'bad');
      if(!ok) $$('.opt',box).forEach(x=>{ if(+x.dataset.o===c.ok) x.classList.add('ok'); });
      $('#rv',box).hidden=false;
    });
  },'Question');
}
function s7(root){
  $('#showq',root).onclick=e=>{ $('#enq',root).hidden=false; e.currentTarget.hidden=true; };
  $('#sayage',root).onclick=e=>{
    const v=$('#age',root).value; if(v==='') return;
    const n=Math.max(0,Math.min(99,+v)); $('#ageTxt',root).textContent=`I am ${n}.`;
    sayQueue([{text:`I am ${numWords(n)}.`,els:[]}],null);
  };
}
function s8(root){
  $('#ql',root).innerHTML=QS.map(g=>`<h2>${g.g}</h2><ul class="qlist">${g.list.map(([en,uk])=>`<li class="q"><span class="en">${en}</span>${listenBtn(en)}<button type="button" class="mini" data-tr>Translate</button><span class="uk" hidden>${uk}</span></li>`).join('')}</ul>`).join('');
  $$('[data-tr]',root).forEach(b=>b.onclick=()=>{ b.closest('.q').querySelector('.uk').hidden=false; b.hidden=true; });
}
function profileInit(root,key){
  const p=PEOPLE[key], lis=$$('.s',root);
  const items=from=>lis.slice(from||0).map(el=>({text:strip(p.lines[+el.dataset.k]),els:[el]}));
  $('#pl',root).onclick=e=>{ const b=e.currentTarget; if(b.getAttribute('aria-pressed')==='true'){stopAll();return;} sayQueue(items(0),b,{gap:350}); };
  lis.forEach(el=>el.onclick=()=>sayQueue(items(+el.dataset.k),null,{gap:350}));
}
const profileHTML=key=>{ const p=PEOPLE[key]; return `<div class="profile"><div class="photo">${photo(key)}</div><div class="card"><div class="card-head"><h3>${p.name}</h3><button type="button" class="mini" id="pl" data-audio aria-pressed="false" data-label="Listen">${ISPK}${ISTOP}<span class="lbl">Listen</span></button></div><ol class="plines" style="list-style:none">${p.lines.map((l,k)=>`<li><span class="s" role="button" tabindex="0" data-k="${k}">${pa(l)}</span></li>`).join('')}</ol></div></div><p class="hint">Look at the underlined words.</p>`; };
const personHTML=(key,intro)=>{ const p=PEOPLE[key];
  const first=intro?`<div class="card"><div class="card-head"><span class="first">${pa(p.lines[0])}</span>${listenBtn(strip(p.lines[0]))}</div></div>`:'';
  return `<div class="profile"><div class="photo">${photo(key)}</div><div>${first}<div class="card"><div class="scroll"><table class="t"><tbody>${p.facts.map(f=>`<tr><td class="k">${f[0]}</td><td class="val">${f[1]}</td></tr>`).join('')}</tbody></table></div></div>
   <button type="button" class="btn primary" id="show">Show the sentences</button>
   <div id="sent" hidden><div class="card" style="margin-top:14px"><div class="card-head"><h3>${p.name}</h3><button type="button" class="mini" id="pl" data-audio aria-pressed="false" data-label="Listen">${ISPK}${ISTOP}<span class="lbl">Listen</span></button></div><ol class="plines" style="list-style:none">${p.lines.map((l,k)=>`<li><span class="s" role="button" tabindex="0" data-k="${k}">${pa(l)}</span></li>`).join('')}</ol></div></div></div></div>`; };
function s11(root,key){
  const p=PEOPLE[key||'marco'];
  $('#show',root).onclick=e=>{ $('#sent',root).hidden=false; e.currentTarget.hidden=true; };
  const lis=$$('.s',root);
  const items=from=>lis.slice(from||0).map(el=>({text:strip(p.lines[+el.dataset.k]),els:[el]}));
  $('#pl',root).onclick=e=>{ const b=e.currentTarget; if(b.getAttribute('aria-pressed')==='true'){stopAll();return;} sayQueue(items(0),b,{gap:350}); };
  lis.forEach(el=>el.onclick=()=>sayQueue(items(+el.dataset.k),null,{gap:350}));
}
function s12(root){
  const p=PEOPLE.kasia, say=p.say;
  const rows=$('#rows',root);
  rows.innerHTML=p.facts.map((f,i)=>`<tr><td class="k">${f[0]}</td><td><button type="button" class="rev" data-i="${i}">?</button><span class="val" hidden>${f[1]}</span></td></tr>`).join('');
  const reveal=(btn,speak)=>{ btn.hidden=true; const v=btn.nextElementSibling; v.hidden=false; if(speak) sayQueue([{text:say[+btn.dataset.i],els:[]}],null); };
  $$('.rev',rows).forEach(b=>b.onclick=()=>reveal(b,true));
  $('#all',root).onclick=()=>$$('.rev',rows).forEach(b=>{ if(!b.hidden) reveal(b,false); });
  $('#hide',root).onclick=()=>{ stopAll(); $$('.rev',rows).forEach(b=>{ b.hidden=false; b.nextElementSibling.hidden=true; }); };
}
function s13(root){
  const body=$('#pb',root);
  body.innerHTML=POSS.map((r,i)=>`<tr data-i="${i}"><td class="k">${r[0]}</td><td><button type="button" class="rev" ${i===0?'hidden':''}>?</button><span class="val" ${i===0?'':'hidden'}><u class="pa">${r[1]}</u></span></td><td class="val ex" ${i===0?'':'hidden'}>${pa(r[2].replace(new RegExp('\\b'+r[1]+'\\b','i'),m=>`[[${m}]]`))}</td></tr>`).join('');
  $$('tr',body).forEach(tr=>{ const b=$('.rev',tr); b.onclick=()=>{ b.hidden=true; $$('.val,.ex',tr).forEach(x=>x.hidden=false); sayQueue([{text:POSS[+tr.dataset.i][2],els:[]}],null); }; });
}
function s14(root){
  const list=$('#gl',root);
  const ans=g=>[...g.s.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1]);
  list.innerHTML=GAPS.map((g,i)=>`<li class="gl"><div class="gl-main"><span class="num">${i+1}</span><p class="gl-text">${apo(esc(g.s)).replace(/\[\[(.+?)\]\]/g,(m,a)=>`<input class="gap" data-i="${i}" type="text" size="${a.length+2}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap in sentence ${i+1}">`)}<span class="h">(${g.h})</span></p></div><div class="gl-meta"><button type="button" class="mini" data-check="${i}">Check</button><button type="button" class="mini" data-show="${i}">Show answer</button><span class="res"></span></div></li>`).join('');
  list.addEventListener('click',e=>{
    const c=e.target.closest('[data-check]'), s=e.target.closest('[data-show]');
    if(c){ const i=+c.dataset.check, inp=$(`input[data-i="${i}"]`,list), ok=inp.value.trim().toLowerCase()===ans(GAPS[i])[0].toLowerCase(); inp.classList.toggle('ok',ok); inp.classList.toggle('bad',!ok&&inp.value.trim()!==''); c.parentElement.querySelector('.res').textContent=ok?'Correct':'Try again'; }
    if(s){ const i=+s.dataset.show, inp=$(`input[data-i="${i}"]`,list); inp.value=ans(GAPS[i])[0]; inp.classList.add('ok'); inp.classList.remove('bad'); s.parentElement.querySelector('.res').textContent=''; sayQueue([{text:strip(GAPS[i].s),els:[]}],null); }
  });
  list.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.classList.contains('gap')) $(`[data-check="${e.target.dataset.i}"]`,list).click(); });
}
function s15(root){
  $$('.fr,.cy li',root).forEach(el=>el.onclick=()=>el.classList.toggle('done'));
}
function s16(root){
  $('#kw',root).innerHTML=KW.map(([k,q])=>`<button type="button" class="kcard" aria-label="${k}. Press to see the question."><div class="kin"><div class="kf">${k}</div><div class="kf back"><span>${q}</span></div></div></button>`).join('');
  $$('.kcard',root).forEach((c,i)=>c.onclick=()=>{ const on=$('.kin',c).classList.toggle('on'); if(on) sayQueue([{text:KW[i][1],els:[]}],null); });
}

/* ---------------- navigation ---------------- */
let cur=0, teacher=false;
$('#steps').innerHTML=SCREENS.map((s,i)=>`<li class="${s.opt?'os':''}"><button type="button" data-go="${i}" aria-label="Screen ${i+1}: ${s.label}">${i+1}</button></li>`).join('');
function renderNotes(){
  const box=$('#tnotes'); const s=SCREENS[cur];
  box.innerHTML=teacher?`<aside class="tnote"><b>Teacher notes</b><ul>${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></aside>`:'';
  $('#tt').setAttribute('aria-pressed',teacher?'true':'false');
}
function go(i,fromHash){
  stopAll(); cur=Math.max(0,Math.min(SCREENS.length-1,i)); const s=SCREENS[cur];
  $('#main').innerHTML=`<p class="eyebrow">${cur+1} · ${s.label}${s.opt?' · optional':''}</p><h1>${s.title}</h1>${s.lead?`<p class="lead">${s.lead}</p>`:''}<div class="body" id="body">${s.html()}</div>`;
  s.init($('#body'));
  $$('#steps button').forEach((b,k)=>{ if(k===cur) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  $('#prev').disabled=cur===0; $('#next').disabled=cur===SCREENS.length-1;
  $('#prev').textContent=cur>0?`← ${SCREENS[cur-1].label}`:'← Back';
  $('#next').textContent=cur<SCREENS.length-1?`${SCREENS[cur+1].label} →`:'The end';
  renderNotes();
  if(!fromHash){ try{ history.replaceState(null,'','#s'+(cur+1)); }catch(e){} }
  window.scrollTo(0,0);
}
$('#steps').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go); });
$('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1);
$('#tt').onclick=()=>{ teacher=!teacher; renderNotes(); };
document.addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(e.target.tagName)) return; if(e.key==='t'||e.key==='T'){ teacher=!teacher; renderNotes(); } });
const h=parseInt((location.hash||'').replace('#s',''),10);
go(h?h-1:0,true);
</script>
