<title>Beginner Lesson 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one presenter stage (teacher clicks, student watches), slim section nav on top, Back/Next at the bottom, optional teacher cue band. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#12203A; --muted:#5B6B85; --line:#CBD5E4;
  --brand:#2B59FF; --on-brand:#FFFFFF; --sun:#FFC93C;
  --am:#2B59FF; --are:#0E8A63; --is:#D9570B; --not:#C9283F;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#17233A; --ink:#EAF0FB; --muted:#98A8C4; --line:#2C3C5B;
    --brand:#7C9BFF; --on-brand:#0E1626; --sun:#FFD25E;
    --am:#8FA9FF; --are:#3FD1A0; --is:#FF9A4D; --not:#FF7A8E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17233A; --ink:#EAF0FB; --muted:#98A8C4; --line:#2C3C5B;
  --brand:#7C9BFF; --on-brand:#0E1626; --sun:#FFD25E;
  --am:#8FA9FF; --are:#3FD1A0; --is:#FF9A4D; --not:#FF7A8E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;font-weight:500}
button{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--font-display);font-weight:600;font-size:20px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.cue{border-style:dashed}
.chip.cue.active{background:var(--sun);color:#12203A;border-color:var(--sun);border-style:solid}
.stage{flex:1;min-height:0;overflow:auto;display:flex}
.wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:22px;padding:6px 0;width:100%}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.phase{display:inline-flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:600;font-size:clamp(30px,4.5vw,52px);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 28px 6px 18px}
.phase .ico{font-size:1.1em;line-height:1}
.hint{font-family:var(--font-display);font-size:clamp(26px,4vw,44px);font-weight:600;text-align:center;text-wrap:balance}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.card{position:relative;perspective:900px;cursor:pointer;width:clamp(140px,19vw,230px);aspect-ratio:1/1.08;outline-offset:4px}
.card.wide{width:clamp(220px,30vw,360px)}
.card .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
.face.back{transform:rotateY(180deg)}
.pic{position:relative;display:inline-block;font-size:clamp(56px,8.5vw,100px);line-height:1.1;white-space:nowrap}
.pic.sm{font-size:clamp(40px,6vw,70px)}
.pic small{position:absolute;right:-.35em;bottom:-.1em;font-size:.45em}
.word{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3.4vw,40px);line-height:1.15}
.word.long{font-size:clamp(18px,2.4vw,28px)}
.chip-p{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,2.6vw,30px);background:var(--sun);color:#12203A;border-radius:999px;padding:0 16px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--on-brand);cursor:pointer;flex:none}
.slot{width:clamp(140px,19vw,230px);aspect-ratio:1/1.08;border:2px dashed var(--line);border-radius:22px}
.new{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.scard{position:relative;width:clamp(220px,28vw,320px);background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer}
.scard .spk{position:absolute;top:10px;right:10px;width:36px;height:36px}
.lines{display:flex;flex-direction:column;gap:6px}
.line{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,2.8vw,34px);line-height:1.2}
.line.ans{opacity:0;transform:translateY(6px);transition:all .3s}
.scard.show .line.ans{opacity:1;transform:none}
.v{font-weight:600;border-radius:8px;padding:0 6px}
.v.am{color:var(--am);background:color-mix(in srgb,var(--am) 16%,transparent)}
.v.are{color:var(--are);background:color-mix(in srgb,var(--are) 16%,transparent)}
.v.is{color:var(--is);background:color-mix(in srgb,var(--is) 16%,transparent)}
.v.not{color:var(--not);background:color-mix(in srgb,var(--not) 16%,transparent)}
.cols{display:flex;flex-wrap:wrap;justify-content:center;gap:28px 48px;align-items:flex-start}
.pairs{display:flex;flex-direction:column;gap:14px}
.pair{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 20px;min-width:min(100%,380px)}
.pair .ua{font-size:clamp(22px,2.8vw,32px);color:var(--muted);min-width:7.5em}
.pair .en{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3.2vw,38px)}
.gap{display:inline-block;min-width:1.4em;text-align:center;border:2px dashed var(--not);color:var(--not);border-radius:8px;font-weight:800}
.tbl{display:flex;flex-direction:column;gap:12px;min-width:min(100%,300px)}
.trow{display:flex;align-items:center;gap:16px;font-family:var(--font-display);font-weight:600;font-size:clamp(28px,4vw,48px);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 22px}
.trow .pr{min-width:3.6em}
.trow.in{animation:pop .4s ease-out}
.trow .v{font-size:1.05em}
.big{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,5.4vw,64px);text-align:center}
.tb{background:var(--sun);color:#12203A;border-radius:16px;padding:6px 26px;font-family:var(--font-display);font-weight:600;font-size:clamp(28px,4vw,48px)}
.fix{display:flex;align-items:center;gap:18px;width:min(100%,640px);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 22px;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.6vw,42px)}
.fix .wr{color:var(--not);text-decoration:line-through;text-decoration-thickness:3px}
.fix .ok{display:none;color:var(--are)}
.fix.done .wr{display:none}.fix.done .ok{display:inline}
.fix .mk{margin-left:auto;font-size:.8em}
.frames{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.frame{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,4vw,46px);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 26px}
.frame u{display:inline-block;min-width:3em;border-bottom:4px solid var(--brand);text-decoration:none}
.frame i{font-style:normal;font-size:.5em;color:var(--muted);font-family:var(--font-body)}
.check{display:flex;align-items:center;gap:18px;font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.8vw,44px);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 24px;cursor:pointer;min-width:min(100%,520px)}
.check .bx{width:1.1em;height:1.1em;border:3px solid var(--line);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.9em;color:transparent}
.check.done .bx{background:var(--are);border-color:var(--are);color:#fff}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 30px}
.cuebar{display:none;border:2px dashed var(--sun);border-radius:14px;padding:8px 16px;font-size:15px;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--sun) 14%,transparent)}
.cuebar.show{display:block}
.cuebar b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-right:8px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{border:0;border-radius:14px;padding:12px 30px;font-weight:800;font-size:18px;cursor:pointer;background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.35;cursor:default}
.mini{border:2px solid var(--line);background:transparent;border-radius:12px;padding:6px 16px;font-weight:800;cursor:pointer}
.count{font-size:14px;color:var(--muted);font-weight:700}
:focus-visible{outline:3px solid var(--brand)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="top">
  <span class="brand">Who is it?</span>
  <nav class="chips" id="chips" aria-label="Sections"></nav>
  <button class="chip cue" id="cuebtn" aria-pressed="false">Teacher cues</button>
</div>
<main class="stage" id="stage"></main>
<div class="cuebar" id="cuebar"></div>
<div class="foot">
  <button class="btn ghost" id="back">Back</button>
  <span class="count" id="count"></span>
  <button class="btn" id="next">Next</button>
</div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');
const SVG = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

function speak(t){
  try{
    const s = window.speechSynthesis; if(!s) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .8;
    s.speak(u);
  }catch(e){}
}
const hl = t => t.replace(/\b(am|are|is|not)\b/gi, m => `<b class="v ${m.toLowerCase()}">${m}</b>`);
const pic = it => `<span class="pic ${it.small?'sm':''}">${it.pic}${it.badge?`<small>${it.badge}</small>`:''}</span>`;
const spk = t => `<span class="spk" data-w="${t}" role="button" tabindex="0" aria-label="Play sound">${SVG}</span>`;
const phase = (ico, w) => `<div class="phase"><span class="ico">${ico}</span><span>${w}</span></div>`;

function card(it, o = {}){
  const w = it.say || it.word;
  const long = it.word.length > 11 ? 'long' : '';
  return `<div class="card ${it.wide?'wide':''} ${o.on?'on':''} ${o.cls||''}" tabindex="0" data-w="${w}">
    <div class="in">
      <div class="face front">${pic(it)}${it.chip?`<span class="chip-p">${it.chip}</span>`:''}</div>
      <div class="face back">${pic(it)}<div class="word ${long}">${it.word}</div>${spk(w)}</div>
    </div></div>`;
}
function sentCard(c, doHl, isNew){
  const lines = c.lines.map(l => {
    const ans = l.startsWith('>'); const t = ans ? l.slice(1) : l;
    return `<div class="line ${ans?'ans':''}">${doHl?hl(t):t}</div>`;
  }).join('');
  const say = c.lines.map(l => l.replace(/^>/,'')).join(' ').replace(/<[^>]+>/g,'');
  return `<div class="scard ${isNew?'new':''}" data-w="${say}">${pic(c)}<div class="lines">${lines}</div>${spk(say)}</div>`;
}

/* ---------- content ---------- */
const INSTR = [
  {pic:'👀', word:'look'}, {pic:'👂', word:'listen'}, {pic:'🗣️', word:'say'},
  {pic:'🔁', word:'repeat'}, {pic:'📖', word:'read'}, {pic:'✍️', word:'write'}
];
const SETS = [
  {sec:1, title:'People', items:[
    {pic:'👨', word:'man'}, {pic:'👩', word:'woman'}, {pic:'👦', word:'boy', small:true}, {pic:'👧', word:'girl', small:true}],
   look:[{pic:'👨 👩', word:'man · woman', say:'man. woman.', wide:true},
         {pic:'👦 👧', word:'boy · girl', say:'boy. girl.', wide:true, small:true}]},
  {sec:2, title:'Jobs', items:[
    {pic:'🧑‍🎓', word:'student'}, {pic:'🧑‍🏫', word:'teacher'}, {pic:'🧑‍⚕️', word:'doctor'}, {pic:'🚕', word:'driver'}]},
  {sec:3, title:'Feelings', items:[
    {pic:'😀', word:'happy'}, {pic:'😢', word:'sad'}, {pic:'😴', word:'tired'}, {pic:'😫', badge:'🍽️', word:'hungry'}]},
  {sec:4, title:'Things', items:[
    {pic:'📱', word:'phone'}, {pic:'💻', word:'laptop'}, {pic:'🐱', word:'cat'}]}
];
const SECS = ['Instructions','People','Jobs','Feelings','Things','Discover','Not and ?','Practice','Finish'];

const SCENES = [];
SCENES.push({sec:0, title:'Instructions', steps:1, kind:'instr',
  cue: () => 'Show the picture only. Ask in Ukrainian: "Do you know this word?" He tries. If he does not know, click the card: the word flips. Say it, click the speaker, then "Let\'s repeat". After this, give instructions only with these words.'});

SETS.forEach(set => {
  const n = set.items.length;
  SCENES.push({sec:set.sec, title:set.title, set, steps:n+3, kind:'set',
    cue: st => st===0 ? 'Pictures only, no words. "What is this?" He guesses in English or Ukrainian. Click a card to flip it and hear the word.'
      : st<=n ? 'Say "Listen." Click Next: a new card appears and the voice says the word. He only listens.'
      : st===n+1 ? 'Say "Repeat." Point to each card: all together first, then he alone. Click a card to hear it again.'
      : 'Say "Say." The words are hidden. You point, he names it, click to check. Shuffle for a speed round.'});
});

SCENES.push({sec:5, title:'Me and you', kind:'cards', steps:2, hl:false, cards:[
  {pic:'🧑‍🏫', lines:['I am a teacher.','I am happy.']},
  {pic:'🧑‍🎓', lines:['You are a student.']}],
  cue: () => 'Point at yourself: "I am a teacher. I am happy." He repeats. Then point at him: "You are a student." Do not explain anything yet.'});
SCENES.push({sec:5, title:'Other people', kind:'cards', steps:4, hl:false, cards:[
  {pic:'👨‍🎓', lines:['He is a student.']},
  {pic:'👩‍⚕️', lines:['She is a doctor.']},
  {pic:'👨', badge:'😢', lines:['He is sad.']},
  {pic:'🐱', lines:['It is a cat.']}],
  cue: () => 'One picture at a time. You say the sentence, he repeats. Still no explanation.'});
SCENES.push({sec:5, title:'Look at the small word', kind:'discover', steps:6,
  cue: st => ['Ask in Ukrainian: what is the same in all English sentences? Which small word is always there?',
    'Compare with Ukrainian: there is no verb in the middle (Я студент). English needs one.',
    'I goes with "am". Say it, he repeats.',
    'You goes with "are".',
    'He, she, it go with "is".',
    'Name it: the verb "to be". Quick drill: you say a pronoun, he says a full sentence.'][st]});

SCENES.push({sec:6, title:'Not', kind:'cards', steps:3, hl:true, cards:[
  {pic:'👩‍⚕️', lines:['She is not a teacher.','She is a doctor.']},
  {pic:'👨', badge:'😴', lines:['He is not happy.','He is tired.']},
  {pic:'🧑‍🏫', lines:['I am not a doctor.','I am a teacher.']}],
  cue: () => 'Say the sentence. Ask: what word did we add? (not) He repeats. Then he says it about the next picture before you click.'});
SCENES.push({sec:6, title:'Questions', kind:'transform', steps:3,
  cue: st => ['Read the sentence together.', 'Ask: what moved? The verb goes to the front. Say the question, he repeats.', 'Short answers: Yes, he is. / No, he is not.'][st]});
SCENES.push({sec:6, title:'Ask and answer', kind:'cards', steps:3, hl:true, cards:[
  {pic:'👩‍⚕️', lines:['Is she a doctor?','>Yes, she is.']},
  {pic:'👨', badge:'😀', lines:['Is he tired?','>No, he is not.','>He is happy.']},
  {pic:'🐱', lines:['Is it a laptop?','>No, it is not.','>It is a cat.']}],
  cue: () => 'Ask the question aloud, he answers. Click the card to check his answer.'});

SCENES.push({sec:7, title:'Look and say', kind:'flip', steps:1, cards:[
  {pic:'👨‍🏫', chip:'he', word:'He is a teacher.'},
  {pic:'😴', chip:'she', word:'She is tired.'},
  {pic:'🐱', chip:'it', word:'It is a cat.'},
  {pic:'🧑‍🎓', chip:'you', word:'You are a student.'},
  {pic:'😀', chip:'I', word:'I am happy.'},
  {pic:'🚕', chip:'he', word:'He is a driver.'}],
  cue: () => 'Each picture has a pronoun. He makes the sentence, then click to check. Mix positive, "not" and questions as you like.'});
SCENES.push({sec:7, title:'Find the mistake', kind:'mistakes', steps:1, rows:[
  ['She am happy.','She is happy.'], ['I is a teacher.','I am a teacher.'],
  ['He are tired.','He is tired.'], ['You is a student.','You are a student.']],
  cue: () => 'Read the wrong sentence aloud. He says what is wrong and fixes it. Click the row to check.'});

SCENES.push({sec:8, title:'Finish', kind:'final', steps:3,
  cue: st => ['He completes each frame about himself. Help with the feeling words.',
    'Tick each one he can do. Click a line to tick it.',
    'Homework: write 5 sentences about himself, then say 5 sentences about the pictures. About ten minutes.'][st]});

/* ---------- state ---------- */
let si = 0, st = 0, shuf = null, cues = false;
try{ cues = localStorage.getItem('cues') === '1'; }catch(e){}

/* ---------- renderers ---------- */
const R = {};
R.instr = () => `<div class="wrap"><div class="kicker">Instructions</div>
  <div class="hint">What does it mean?</div>
  <div class="grid">${INSTR.map(i => card(i)).join('')}</div></div>`;

R.set = sc => {
  const n = sc.set.items.length, items = sc.set.items;
  let h = '';
  if(st === 0){
    h = phase('👀','Look') + `<div class="grid">${(sc.set.look || items).map(i => card(i)).join('')}</div>`;
  } else if(st <= n){
    h = phase('👂','Listen') + `<div class="grid">${items.map((it,i) => i < st ? card(it,{on:true, cls:i===st-1?'new':''}) : '<div class="slot"></div>').join('')}</div>`;
  } else if(st === n+1){
    h = phase('🔁','Repeat') + `<div class="grid">${items.map(it => card(it,{on:true})).join('')}</div>`;
  } else {
    const list = shuf || items;
    h = phase('🗣️','Say') + `<div class="grid">${list.map(it => card(it)).join('')}</div><button class="mini" id="shuf">Shuffle</button>`;
  }
  return `<div class="wrap"><div class="kicker">${sc.title}</div>${h}</div>`;
};

R.cards = sc => `<div class="wrap"><div class="kicker">${sc.title}</div>
  <div class="grid">${sc.cards.map((c,i) => i <= st ? sentCard(c, sc.hl, i===st) : '').join('')}</div></div>`;

R.discover = () => {
  const rows = [['Я студент','I am a student'],['Вона лікарка','She is a doctor'],['Він сумний','He is sad']];
  const pairs = rows.map(([ua,en]) => {
    const u = st >= 1 ? ua.replace(' ', ' <span class="gap">?</span> ') : ua;
    return `<div class="pair"><span class="ua">${u}</span><span class="en">${st>=1?hl(en):en}</span></div>`;
  }).join('');
  const t = [['I','am'],['you','are'],['he / she / it','is']];
  const shown = Math.max(0, st-1);
  const tbl = t.slice(0, shown).map((r,i) => `<div class="trow ${i===shown-1?'in':''}"><span class="pr">${r[0]}</span><span>→</span>${hl(r[1])}</div>`).join('');
  const name = st >= 5 ? '<div class="tb">the verb “to be”</div>' : '';
  return `<div class="wrap"><div class="kicker">Look at the small word</div>
    <div class="cols"><div class="pairs">${pairs}</div>${shown?`<div class="tbl">${tbl}${name}</div>`:''}</div></div>`;
};

R.transform = () => {
  const a = `<div class="big">${'He is a student.'}</div>`;
  const b = st >= 1 ? `<div class="big">${hl('Is')} he a student?</div>` : '';
  const c = st >= 2 ? `<div class="grid"><div class="tb">Yes, he ${hl('is')}.</div><div class="tb">No, he ${hl('is')} ${hl('not')}.</div></div>` : '';
  return `<div class="wrap"><div class="kicker">Questions</div>${pic({pic:'👨‍🎓'})}${a}${b}${c}</div>`;
};

R.flip = sc => `<div class="wrap"><div class="kicker">Look and say</div>${phase('🗣️','Say')}
  <div class="grid">${sc.cards.map(c => card(c)).join('')}</div></div>`;

R.mistakes = sc => `<div class="wrap"><div class="kicker">Find the mistake</div>${phase('🔎','Find the mistake')}
  ${sc.rows.map(r => `<div class="fix" tabindex="0"><span class="wr">${r[0]}</span><span class="ok">${hl(r[1])}</span><span class="mk">✓</span></div>`).join('')}</div>`;

R.final = () => {
  if(st === 0) return `<div class="wrap"><div class="kicker">Finish</div>${phase('🗣️','Say 5 sentences about you')}
    <div class="frames"><div class="frame">I am <u></u> <i>name</i></div><div class="frame">I am a <u></u> <i>job</i></div><div class="frame">I am <u></u> <i>feeling</i></div></div></div>`;
  if(st === 1) return `<div class="wrap"><div class="kicker">Finish</div><div class="hint">Can you…?</div>
    ${['say who you are','say how you feel','say who he or she is'].map(t => `<div class="check" tabindex="0"><span class="bx">✓</span><span>${t}</span></div>`).join('')}</div>`;
  const faces = [{pic:'👨',badge:'😢'},{pic:'👩',badge:'😴'},{pic:'👦',badge:'😫',small:true},{pic:'👧',badge:'😀',small:true},{pic:'🧑‍🏫',badge:'😀'}];
  return `<div class="wrap"><div class="kicker">Homework</div>${phase('✍️','Write')}
    <div class="hint">5 sentences about you</div>${phase('🗣️','Say')}
    <div class="faces">${faces.map(pic).join('')}</div></div>`;
};

/* ---------- binding ---------- */
function bind(sc){
  const flip = ['instr','flip'].includes(sc.kind) || (sc.kind === 'set' && (st === 0 || st === sc.set.items.length + 2));
  stage.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', e => {
      const w = c.dataset.w;
      if(e.target.closest('.spk')){ speak(w); return; }
      if(flip){ c.classList.toggle('on'); if(c.classList.contains('on')) speak(w); }
      else speak(w);
    });
    c.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); c.click(); } });
  });
  stage.querySelectorAll('.scard').forEach(c => c.addEventListener('click', e => {
    if(!e.target.closest('.spk')) c.classList.toggle('show');
    speak(c.dataset.w);
  }));
  stage.querySelectorAll('.spk').forEach(s => s.addEventListener('keydown', e => { if(e.key==='Enter') speak(s.dataset.w); }));
  stage.querySelectorAll('.fix').forEach(f => {
    f.addEventListener('click', () => f.classList.toggle('done'));
    f.addEventListener('keydown', e => { if(e.key==='Enter') f.classList.toggle('done'); });
  });
  stage.querySelectorAll('.check').forEach(f => {
    f.addEventListener('click', () => f.classList.toggle('done'));
    f.addEventListener('keydown', e => { if(e.key==='Enter') f.classList.toggle('done'); });
  });
  const sb = $('#shuf');
  if(sb) sb.addEventListener('click', () => {
    const a = sc.set.items.slice();
    for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
    shuf = a; render(false);
  });
}

/* ---------- navigation ---------- */
const total = SCENES.reduce((a,s) => a + s.steps, 0);
function go(i, s){ si = i; st = s; shuf = null; render(true); }
function next(){ const sc = SCENES[si]; if(st < sc.steps-1) go(si, st+1); else if(si < SCENES.length-1) go(si+1, 0); }
function back(){ if(st > 0) go(si, st-1); else if(si > 0) go(si-1, SCENES[si-1].steps-1); }

function render(auto){
  const sc = SCENES[si];
  stage.innerHTML = R[sc.kind](sc);
  stage.scrollTop = 0;
  bind(sc);
  if(auto && sc.kind === 'set' && st >= 1 && st <= sc.set.items.length) speak(sc.set.items[st-1].word);
  if(auto && sc.kind === 'cards') speak(sc.cards[st].lines.filter(l => !l.startsWith('>')).join(' ').replace(/<[^>]+>/g,''));
  document.querySelectorAll('.chip[data-sec]').forEach(c => c.classList.toggle('on', +c.dataset.sec === sc.sec));
  let done = 0; for(let k = 0; k < si; k++) done += SCENES[k].steps;
  $('#count').textContent = (done + st + 1) + ' / ' + total;
  $('#back').disabled = (si === 0 && st === 0);
  $('#next').disabled = (si === SCENES.length-1 && st === sc.steps-1);
  const cb = $('#cuebar');
  cb.innerHTML = '<b>Teacher cue</b>' + sc.cue(st);
  cb.classList.toggle('show', cues);
}

$('#chips').innerHTML = SECS.map((n,i) => `<button class="chip" data-sec="${i}">${n}</button>`).join('');
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  go(SCENES.findIndex(s => s.sec === +c.dataset.sec), 0);
});
$('#next').addEventListener('click', next);
$('#back').addEventListener('click', back);
$('#cuebtn').addEventListener('click', () => {
  cues = !cues;
  try{ localStorage.setItem('cues', cues ? '1' : '0'); }catch(e){}
  $('#cuebtn').classList.toggle('active', cues);
  $('#cuebtn').setAttribute('aria-pressed', cues);
  $('#cuebar').classList.toggle('show', cues);
});
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') back();
});
$('#cuebtn').classList.toggle('active', cues);
render(false);
</script>
